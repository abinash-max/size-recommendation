AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Size Recommendation API using FastAPI on AWS Lambda

Parameters:
  GoogleApiKey:
    Type: String
    Description: Google AI API Key
    NoEcho: true
  CheckpointPath:
    Type: String
    Description: Path to classifier checkpoint (S3 or local)
   

Globals:
  Function:
    Timeout: 900
    MemorySize: 3008
    Runtime: python3.11
    Environment:
      Variables:
        GOOGLE_API_KEY: !Ref GoogleApiKey
        CHECKPOINT_PATH: !Ref CheckpointPath

Resources:
  SizeRecommendationApi:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: size-recommendation-models
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref SizeRecommendationApiGateway
        RootEvent:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref SizeRecommendationApiGateway

  SizeRecommendationApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
  
  # Note: Update region to ap-south-1 in your deployment

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SizeRecommendationApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/"

