service: size-recommendation-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ap-south-1
  timeout: 900  # 15 minutes (max for Lambda)
  memorySize: 3008  # Max memory for better performance
  environment:
    GOOGLE_API_KEY: ${env:GOOGLE_API_KEY}
    CHECKPOINT_PATH: ${env:CHECKPOINT_PATH, 's3://your-bucket/models/best_model.pth'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: "arn:aws:s3:::your-bucket/*"

functions:
  api:
    handler: lambda_handler.lambda_handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: false
    noDeps: false

